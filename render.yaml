services:
  # Express Backend Web Service
  - type: web
    name: medicare-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard (e.g. your cluster connection string)
      - key: JWT_SECRET
        sync: false # Set this to a random secret string in Render Dashboard

  # React Frontend Static Site
  - type: static
    name: medicare-frontend
    buildCommand: npm install && CI=false npm run build
    publishPath: build
    rootDir: frontend
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: medicare-backend
          property: host
